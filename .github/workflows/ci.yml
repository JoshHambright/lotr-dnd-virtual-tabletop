name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm does not hoist, so a package can only import what it declares. That
  # strictness is why the monorepo is safe for parallel workstreams.
  PNPM_VERSION: 10.33.0

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Types
        run: pnpm typecheck
      - name: Tests and coverage
        run: pnpm coverage
      - name: Build
        run: pnpm build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  end-to-end:
    name: Leak assertions against a real server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Plants marked secrets in staged scenes, hidden tokens, stat blocks and
      # GM notes, then proves none reach a real player socket. Treated as a
      # security test: never skipped, never made advisory.
      - name: Start the server
        run: pnpm --filter @vtt/adapter-cloudflare exec wrangler dev --port 8787 &
      - name: Wait for it
        run: pnpm exec wait-on http://127.0.0.1:8787 --timeout 90000
      - name: Smoke test
        run: node scripts/smoke.mjs

  contracts:
    name: Frozen contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Phase 1 runs several workstreams in parallel against contracts frozen
      # in Phase 0. Changing one mid-phase invalidates work already in flight,
      # so a change here has to be a deliberate, reviewed act.
      - name: Warn on contract changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            packages/protocol/src packages/rulesets/src/pack.ts packages/formula/src || true)
          if [ -n "$CHANGED" ]; then
            echo "::warning::This PR changes a frozen contract:"
            echo "$CHANGED" | while read -r f; do echo "::warning::  $f"; done
            echo "Confirm the 'breaking contract change' box in the PR template."
          fi

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit
        run: pnpm audit --audit-level high
